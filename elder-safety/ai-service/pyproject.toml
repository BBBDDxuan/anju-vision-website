[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elder-safety-ai-service"
version = "0.1.0"
description = "Local temporal elder safety AI MVP with durable delivery"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10,<6", "httpx>=0.27,<1"]

[project.optional-dependencies]
pose = ["ultralytics>=8.3,<9"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
